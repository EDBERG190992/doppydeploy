<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doppy · Clinic Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --blue:#2563EB;
    --blue-dark:#1D4ED8;
    --blue-100:#DBEAFE;
    --blue-50:#EFF6FF;
    --green:#16A34A;
    --green-100:#DCFCE7;
    --amber:#D97706;
    --amber-100:#FEF3C7;
    --red:#DC2626;
    --red-100:#FEE2E2;
    --purple:#7C3AED;
    --purple-100:#EDE9FE;
    --ink:#0F172A;
    --ink-2:#334155;
    --muted:#64748B;
    --line:#E5E7EB;
    --bg:#F5F6F8;
    --card:#FFFFFF;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;color:var(--ink);background:var(--bg);
    background-image:radial-gradient(#e3e6ec 1px,transparent 1px);background-size:22px 22px;}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px;}

  /* ---------- layout ---------- */
  .app{display:flex;min-height:100vh;}
  .sidebar{width:260px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);
    padding:28px 20px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .logo{display:flex;align-items:center;gap:10px;padding:4px 8px 20px;font-weight:800;font-size:20px;}
  .logo svg{flex-shrink:0;}
  .nav{display:flex;flex-direction:column;gap:6px;flex:1;}
  .nav-item{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:12px;
    color:var(--ink-2);font-weight:600;font-size:15px;border:none;background:transparent;width:100%;text-align:left;}
  .nav-item svg{width:36px;height:36px;flex-shrink:0;}
  .nav-item:hover{background:#F1F5F9;}
  .nav-item.active{background:var(--blue);color:#fff;}
  .nav-item.active svg{stroke:#fff;}
  .nav-item svg{stroke:#087cbf;}
  .promo{margin-top:14px;background:#F8FAFC;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;}
  .promo img{width:100%;border-radius:8px;margin-bottom:8px;}
  .promo h4{margin:0 0 4px;font-size:13px;}
  .promo p{margin:0 0 10px;font-size:12px;color:var(--muted);line-height:1.4;}
  .promo button{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px;font-weight:600;}
  .logout-row{display:flex;align-items:center;gap:6px;padding:4px 8px;color:var(--muted);font-size:12px;font-weight:500;border:none;background:none;margin-top:6px;border-radius:6px;min-height:28px;line-height:1;}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;gap:16px;padding:14px 26px;background:var(--card);
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;}
  .search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--bg);
    border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--muted);font-size:14px;}
  .search input{border:none;background:transparent;outline:none;font-size:14px;width:100%;font-family:inherit;color:var(--ink);}
  .topbar-right{display:flex;align-items:center;gap:16px;margin-left:auto;position:relative;}
  .clinic-pill{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;
    padding:8px 12px;font-size:13px;font-weight:600;background:#fff;}
  .bell{position:relative;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;
    display:flex;align-items:center;justify-content:center;}
  .bell .dot{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:700;
    border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;}
  .profile{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#a5b4fc,#f0abfc);
    display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px;}
  .profile .name{font-size:13px;font-weight:600;line-height:1.2;}
  .profile .role{font-size:11px;color:var(--muted);}
  .dropdown{position:absolute;top:48px;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;
    box-shadow:0 12px 32px rgba(15,23,42,.12);min-width:230px;padding:8px;display:none;z-index:50;}
  .dropdown.open{display:block;}
  .dropdown .item{padding:10px 12px;border-radius:8px;font-size:13px;display:flex;gap:8px;align-items:flex-start;}
  .dropdown .item:hover{background:#F1F5F9;}
  .dropdown .item b{display:block;font-size:13px;}
  .dropdown .item span{color:var(--muted);font-size:12px;}
  .dropdown hr{border:none;border-top:1px solid var(--line);margin:6px 0;}

  .content{padding:24px 26px 60px;flex:1;}
  .breadcrumb{font-size:13px;color:var(--muted);margin-bottom:6px;}
  .breadcrumb b{color:var(--ink);}
  .page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap;gap:12px;}
  .page-head h1{margin:0 0 4px;font-size:24px;}
  .page-head p{margin:0;color:var(--muted);font-size:14px;}
  .head-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .btn{display:flex;align-items:center;gap:6px;padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink-2);white-space:nowrap;}
  .btn:hover{background:#F8FAFC;}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
  .btn.primary:hover{background:var(--blue-dark);}
  .btn.danger{background:#fff;border-color:var(--red);color:var(--red);}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:20px;}
  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
  .stat-card .top{display:flex;align-items:flex-start;gap:12px;}
  .stat-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .stat-icon img{width:1.3em;height:1.3em;display:block;object-fit:contain;}
  .stat-card h3{margin:0;font-size:13px;color:var(--muted);font-weight:600;}
  .stat-card .num{font-size:26px;font-weight:800;margin-top:2px;}
  .stat-card .delta{font-size:12px;margin-top:8px;font-weight:600;}
  .delta.up{color:var(--green);}
  .delta.down{color:var(--red);}

  .grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;margin-bottom:18px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
  .card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .card-head h3{margin:0;font-size:16px;}
  .link{color:var(--blue);font-size:13px;font-weight:600;border:none;background:none;}

  .activity-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #F1F5F9;}
  .activity-item:last-child{border:none;}
  .dot-lead{width:9px;height:9px;border-radius:50%;margin-top:6px;flex-shrink:0;}
  .activity-item .txt b{font-size:13.5px;}
  .activity-item .txt p{margin:2px 0 0;font-size:12.5px;color:var(--muted);}
  .activity-item .time{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;}

  .quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .quick-grid-4{grid-template-columns:repeat(4,1fr);}
  .afiliacion-actions{display:flex;flex-direction:column;gap:12px;margin-top:18px;}
  .afiliacion-actions .quick-btn{width:100%;}
  .menu-btn{display:none;}
  .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:90;}
  .sidebar-backdrop.open{display:block;}
  .quick-btn{border:none;border-radius:12px;padding:16px;text-align:left;cursor:pointer;}
  .quick-btn .qicon{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;margin-bottom:10px;font-size:16px;}
  .quick-btn b{display:block;font-size:13.5px;}
  .quick-btn span{font-size:12px;opacity:.75;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.02em;
    padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
  td{padding:10px;border-bottom:1px solid #F1F5F9;vertical-align:middle;}
  tr.table-row:hover{background:#FAFBFF;}
  .cell-person{display:flex;align-items:center;gap:10px;}
  .thumb{width:32px;height:32px;border-radius:9px;background:#E2E8F0;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
  .cell-person .sub{font-size:12px;color:var(--muted);}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;}
  .badge.green{background:var(--green-100);color:var(--green);}
  .badge.amber{background:var(--amber-100);color:var(--amber);}
  .badge.red{background:var(--red-100);color:var(--red);}
  .badge.gray{background:#F1F5F9;color:var(--muted);}
  .row-actions{display:flex;gap:6px;}
  .icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;}
  .icon-btn:hover{background:#F8FAFC;}
  .icon-btn svg{width:15px;height:15px;}
  .table-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px;color:var(--muted);flex-wrap:wrap;gap:10px;}
  .pager{display:flex;gap:6px;align-items:center;}
  .pager button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;}
  .pager button.active{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700;}
  .pets-table-wrap{max-height:min(520px, 70vh);overflow:auto;border:1px solid var(--line);border-radius:10px;scrollbar-gutter:stable;}
  .pets-table-wrap table{width:100%;border-collapse:collapse;font-size:13.5px;}
  .pets-table-wrap th{position:sticky;top:0;background:#fff;z-index:1;}
  .pets-table-wrap td:last-child{white-space:nowrap;}

  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  .filters select, .filters .search{font-size:13px;padding:9px 10px;}
  select{border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink-2);} 
  .filter-panel{margin-top:10px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#F8FAFC;display:none;gap:12px;flex-wrap:wrap;align-items:end;}
  .filter-panel.open{display:flex;}
  .filter-panel .field{min-width:180px;}
  .filter-panel .field label{font-size:12px;color:var(--muted);}
  .tab{padding:10px 4px;margin-right:20px;border:none;background:none;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;font-size:14px;}
  .tab.active{color:var(--blue);border-color:var(--blue);}

  .split{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start;}
  .code-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;position:sticky;top:88px;}
  .code-panel .qr{width:100%;min-height:200px;background:#fff;
    border-radius:10px;margin:14px 0;border:1px solid var(--line);padding:10px;}
  .code-panel .qr img, .code-panel .qr canvas{max-width:100%;height:auto;}
  .kv{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid #F1F5F9;}
  .kv span:first-child{color:var(--muted);}
  .kv span:last-child{font-weight:600;text-align:right;}

  .form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  .form-grid.two{grid-template-columns:1fr 1fr;}
  .field{display:flex;flex-direction:column;gap:6px;font-size:13px;}
  .field label{font-weight:600;color:var(--ink-2);}
  .field input, .field select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:13.5px;}
  .field.full{grid-column:1/-1;}

  .toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:14px 18px;border-radius:10px;
    font-size:13.5px;font-weight:600;box-shadow:0 12px 32px rgba(0,0,0,.25);opacity:0;transform:translateY(12px);
    transition:.25s;z-index:200;display:flex;align-items:center;gap:10px;}
  .toast.show{opacity:1;transform:translateY(0);}

  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:150;padding:20px;}
  .modal-bg.open{display:flex;}
  .modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:560px;max-height:90vh;overflow:auto;}
  .modal h2{margin:0 0 4px;font-size:19px;}
  .modal p.sub{margin:0 0 18px;color:var(--muted);font-size:13.5px;}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}

  .page{display:none;}
  .page.active{display:block;}
  .empty-note{background:#F8FAFC;border:1px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--muted);font-size:14px;}

  @media(max-width:1100px){
    .grid-2{grid-template-columns:1fr;}
    .split{grid-template-columns:1fr;}
    .code-panel{position:static;}
    .quick-grid-4{grid-template-columns:1fr 1fr;}
  }
  @media(max-width:860px){
    .sidebar{position:fixed;top:0;left:-270px;bottom:0;z-index:100;transition:left .25s;height:100vh;}
    .sidebar.open{left:0;box-shadow:0 0 40px rgba(0,0,0,.25);}
    .menu-btn{display:flex;}
    .clinic-pill span{display:none;}
    .topbar{padding:12px 14px;gap:10px;}
    .content{padding:16px 14px 40px;}
    .page-head{flex-direction:column;align-items:stretch;}
    .head-actions{width:100%;}
    .head-actions .btn{flex:1;justify-content:center;}
    .stats{grid-template-columns:1fr 1fr;}
    .form-grid, .form-grid.two{grid-template-columns:1fr;}
  }
  @media(max-width:640px){
    .search{display:none;}
    .stats{grid-template-columns:1fr;}
    .quick-grid, .quick-grid-4{grid-template-columns:1fr;}
    .profile .name, .profile .role{display:none;}
    table{font-size:12.5px;}
    th, td{padding:8px 6px;}
    .clinic-pill{padding:8px;}
    .clinic-pill svg{margin:0;}
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
const translations = {
  en: {
    nav: { dashboard: 'Dashboard', pacientes: 'Patients', personal: 'Staff', afiliaciones: 'Affiliations', reportes: 'Reports', config: 'Settings' },
    promo: { title: 'Improve every pet’s health 💙', text: 'Discover all the features Doppy has for your clinic.', button: 'Learn more' },
    logout: 'Log out',
    topbar: { searchPlaceholder: 'Search patients, owners, affiliation codes...', clinic: 'Happy Paws Veterinary Clinic' },
    profile: { myProfile: 'My Profile', config: 'Settings', logout: 'Log out' },
    breadcrumbs: { dashboard: 'Dashboard', patients: 'Patients', patientsList: 'Patient List', config: 'Settings', clinicInfo: 'Clinic Information', reports: 'Reports' },
    patients: { title: 'Patients (Pets)', subtitle: 'Manage and review all pets registered in your clinic.', empty: 'No pets matched those filters.', noResults: 'No results found for this search' },
    filters: { more: 'More filters', clear: 'Clear' },
    pets: { table: { pet: 'Pet', species: 'Species', breed: 'Breed', owner: 'Owner', vet: 'Veterinarian', vaccination: 'Vaccination', nextVisit: 'Next Visit', actions: 'Actions' } },
    config: { title: 'Settings', subtitle: 'Manage and personalize your clinic and the Doppy platform.', clinicInfo: 'Clinic Information', name: 'Clinic Name', address: 'Address', city: 'City', province: 'Province', postalCode: 'Postal Code', phone: 'Phone', email: 'Email', website: 'Website', language: 'Language', save: 'Save Changes', cancel: 'Cancel', plan: 'Your Current Plan', planProfessional: 'Professional Plan', users: 'Users', patients: 'Patients', nextCharge: 'Next charge', managePlan: 'Manage Subscription', help: 'Need help?', helpText: 'Our team is ready to help with any questions.', contactSupport: 'Contact Support', toast: { saveSuccess: '✅ Changes saved successfully', discardChanges: 'Changes discarded', managePlan: 'Opening subscription management', contactSupport: 'Connecting to support…' } },
    states: { upToDate: 'Up to date', upcoming: 'Upcoming', overdue: 'Overdue', active: 'Active', pending: 'Pending', expired: 'Expired', vacation: 'On vacation', inactive: 'Inactive' },
    common: { ok: 'OK' }
  },
  es: {
    nav: { dashboard: 'Dashboard', pacientes: 'Patients', personal: 'Staff', afiliaciones: 'Affiliations', reportes: 'Reports', config: 'Settings' },
    promo: { title: 'Improve every pet’s health 💙', text: 'Discover all the features Doppy has for your clinic.', button: 'Learn more' },
    logout: 'Log out',
    topbar: { searchPlaceholder: 'Search patients, owners, affiliation codes...', clinic: 'Happy Paws Veterinary Clinic' },
    profile: { myProfile: 'My Profile', config: 'Settings', logout: 'Log out' },
    breadcrumbs: { dashboard: 'Dashboard', patients: 'Patients', patientsList: 'Patient List', config: 'Settings', clinicInfo: 'Clinic Information', reports: 'Reports' },
    patients: { title: 'Patients (Pets)', subtitle: 'Manage and review all pets registered in your clinic.', empty: 'No pets matched those filters.', noResults: 'No results found for this search' },
    filters: { more: 'More filters', clear: 'Clear' },
    pets: { table: { pet: 'Pet', species: 'Species', breed: 'Breed', owner: 'Owner', vet: 'Veterinarian', vaccination: 'Vaccination', nextVisit: 'Next Visit', actions: 'Actions' } },
    config: { title: 'Settings', subtitle: 'Manage and personalize your clinic and the Doppy platform.', clinicInfo: 'Clinic Information', name: 'Clinic Name', address: 'Address', city: 'City', province: 'Province', postalCode: 'Postal Code', phone: 'Phone', email: 'Email', website: 'Website', language: 'Language', save: 'Save Changes', cancel: 'Cancel', plan: 'Your Current Plan', planProfessional: 'Professional Plan', users: 'Users', patients: 'Patients', nextCharge: 'Next charge', managePlan: 'Manage Subscription', help: 'Need help?', helpText: 'Our team is ready to help with any questions.', contactSupport: 'Contact Support', toast: { saveSuccess: '✅ Changes saved successfully', discardChanges: 'Changes discarded', managePlan: 'Opening subscription management', contactSupport: 'Connecting to support…' } },
    states: { upToDate: 'Up to date', upcoming: 'Upcoming', overdue: 'Overdue', active: 'Active', pending: 'Pending', expired: 'Expired', vacation: 'On vacation', inactive: 'Inactive' },
    common: { ok: 'OK' }
  }
};
let currentLang = localStorage.getItem('doppyLang') || 'en';

function getTranslation(key, fallback) {
  const lang = translations[currentLang] ? currentLang : 'en';
  const parts = key.split('.');
  let value = translations[lang];
  for (const part of parts) {
    value = value?.[part];
    if (value === undefined) break;
  }
  return value ?? fallback ?? key;
}

function applyTranslations() {
  const lang = translations[currentLang] ? currentLang : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const value = getTranslation(key, el.textContent);
    if (value !== undefined) el.textContent = value;
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    const value = getTranslation(key, el.getAttribute('placeholder'));
    if (value !== undefined) el.setAttribute('placeholder', value);
  });
  const cfgIdioma = document.getElementById('cfgIdioma');
  if (cfgIdioma) cfgIdioma.value = lang;
}

function setLanguage(lang) {
  currentLang = lang in translations ? lang : 'en';
  localStorage.setItem('doppyLang', currentLang);
  applyTranslations();
  renderPets();
  renderAfiliaciones();
  renderVets();
  renderDashboardTables();
}

const __BODY_TEMPLATE__ = () => `
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="logo" style="display:flex;justify-content:center;margin-bottom:16px;">
      <img src="assets/Type 2.png" alt="Doppy Logo" width="150" height="130">
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item" data-page="dashboard">${ICON.home} <span data-i18n="nav.dashboard">Dashboard</span></button>
      <button class="nav-item" data-page="pacientes">${ICON.paw} <span data-i18n="nav.pacientes">Patients</span></button>
      <button class="nav-item" data-page="personal">${ICON.staff} <span data-i18n="nav.personal">Staff</span></button>
      <button class="nav-item" data-page="afiliaciones">${ICON.tag} <span data-i18n="nav.afiliaciones">Affiliations</span></button>
      <button class="nav-item" data-page="reportes">${ICON.chart} <span data-i18n="nav.reportes">Reports</span></button>
      <button class="nav-item" data-page="configuracion">${ICON.gear} <span data-i18n="nav.config">Settings</span></button>
    </nav>
    <div class="promo">
      <div style="margin-bottom:4px;">
        <img src="assets/paww.png" alt="Paw" style="width:34px;height:34px;object-fit:contain;display:block;">
      </div>
      <h4 data-i18n="promo.title">Improve every pet’s health 💙</h4>
      <p data-i18n="promo.text">Discover all the features Doppy has for your clinic.</p>

      </div>

  `).join('') : `<div class="empty-note" style="padding:16px;">There are no pending affiliation requests at the moment.</div>`;

function aprobarSolicitud(id){
  const s = solicitudes.find(x => x.id===id);
  if(!s) return;
  solicitudes = solicitudes.filter(x => x.id!==id);
  const codeItem = affiliations.find(a => a.code===s.code) || expiredAffiliations.find(a => a.code===s.code);
  if(codeItem){
    codeItem.owner = s.nombre;
    codeItem.email = s.email;
    codeItem.status = 'Active';
  }
  renderSolicitudes();
  renderAfiliaciones();
  renderDashboardTables();
  toast(`✅ ${s.nombre} was approved and affiliated with the clinic`);
}

function rechazarSolicitud(id){
  const s = solicitudes.find(x => x.id===id);
  if(!s) return;
  solicitudes = solicitudes.filter(x => x.id!==id);
  renderSolicitudes();
  toast(`❌ ${s.nombre}'s request was rejected`);
}

/* ============================================================
   INTEGRATION POINT: Affiliation via QR or manual code
   ------------------------------------------------------------
   This is the function that should be called when an owner:
     a) scans the QR code of an affiliation code, or
     b) manually types the alphanumeric code into the app.
   The QR and the text code represent exactly the same data,
   so both paths must end up calling this same function so the
   result is identical.

   TODO: POST /api/affiliations/request
   Once a real backend exists, the owner's app (with the camera
   to scan the QR, or with a field to type the code) should make
   a POST request to this endpoint with { code, name, email }.
   The backend creates the pending request and this panel
   receives it (via websocket/polling) by calling
   recibirSolicitudAfiliacion(...) so it appears here under
   "Affiliation Requests".
   ============================================================ */
function recibirSolicitudAfiliacion(code, nombre, email){
  const existe = affiliations.find(a => a.code===code) || expiredAffiliations.find(a => a.code===code);
  if(!existe){
    toast(`⚠️ Code ${code} is not valid or no longer exists`);
    return;
  }
  const yaPendiente = solicitudes.some(s => s.code===code && s.email===email);
  if(yaPendiente){
    toast('There is already a pending request for this code');
    return;
  }
  const id = 'SOL-' + Date.now();
  solicitudes.push({ id, code, nombre: nombre || 'New Owner', email: email || 'no-email@email.com', time: 'Now' });
  renderSolicitudes();
  notifications.unshift({icon:'📷', title:'New affiliation request', desc:`${nombre || 'An owner'} wants to affiliate with code ${code}`, time:'Now'});
  renderNotifications();
  toast(`📷 New affiliation request received: ${nombre || 'New owner'}`);
}
// Exposed globally so the future owner app (QR camera or manual code entry) can call it directly.
window.recibirSolicitudAfiliacion = recibirSolicitudAfiliacion;

    'On vacation': getTranslation('states.vacation', 'On vacation'),

}

let selectedCode = null;

// The QR encodes the same alphanumeric code shown as text (e.g. "DOPPY-9X7K-2L1M").
// The future owner app (QR camera) should decode this text and call recibirSolicitudAfiliacion(code, name, email).
function drawQR(containerId, text){
  const el = document.getElementById(containerId);
  if(!el) return;
  el.innerHTML = '';
  if(window.QRCode){
    new QRCode(el, {text, width:200, height:200, colorDark:'#0F172A', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M});
  } else {
    // fallback if the QR library hasn't loaded yet
    el.innerHTML = `<div style="width:200px;height:200px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center;padding:10px;">Could not load the QR generator</div>`;
  }
}

function downloadQR(containerId, filename){
  const el = document.getElementById(containerId);
  const img = el?.querySelector('img');
  const canvas = el?.querySelector('canvas');
  const src = img ? img.src : (canvas ? canvas.toDataURL('image/png') : null);
  if(!src){ toast('The QR code is still being generated, please try again'); return; }
  const a = document.createElement('a');
  a.href = src;
  a.download = filename + '.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast('⬇️ QR code downloaded');
}

function shareCode(code){
  const shareText = `Join Happy Paws Veterinary Clinic on Doppy with code: ${code}`;
  if(navigator.share){
    navigator.share({title:'Doppy affiliation code', text:shareText}).catch(()=>{});
  } else if(navigator.clipboard){
    navigator.clipboard.writeText(shareText);
    toast('🔗 Share link copied to clipboard');
  } else {
    toast('🔗 ' + shareText);
  }
}

function showFirstOrSelectedCode(){

  showCodeDetails(target);

}

function regenerarSelected(){
  const list = currentAfilList();
  if(!list.length){ toast('No codes to regenerate'); return; }
  const target = list.find(x => x.code===selectedCode) ? selectedCode : list[0].code;
  regenerarCodigo(target);
}

function randomCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const rand = n => Array.from({length:n}, () => chars[Math.floor(Math.random()*chars.length)]).join('');
  return `DOPPY-${rand(4)}-${rand(4)}`;
}

function regenerarCodigo(oldCode){
  const list = currentAfilList();
  const item = list.find(x => x.code===oldCode);
  if(!item) return;
  const newCode = randomCode();
  item.code = newCode;
  item.uses = '0/10';
  toast(`🔄 Code regenerated: ${newCode}`);
  renderAfiliaciones();
  if(selectedCode === oldCode) showCodeDetails(newCode);
}

/* ---- Export report to PDF (real, using jsPDF) ---- */
function exportarReportePDF(){
  if(typeof window.jspdf === 'undefined'){ toast('Could not load the PDF generator'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const margin = 40;
  let y = margin;

  doc.setFont('helvetica','bold'); doc.setFontSize(18);
  doc.text('Clinic Report — Happy Paws Veterinary Clinic', margin, y); y += 22;
  doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(100);
  const rangoTexto = document.getElementById('repRango').selectedOptions[0].text;
  doc.text(`Range: ${rangoTexto}  ·  Generated: ${new Date().toLocaleString('en-US')}`, margin, y); y += 24;
  doc.setTextColor(20);

  doc.setFont('helvetica','bold'); doc.setFontSize(12);
  const kpis = [
    ['Total Appointments', document.getElementById('repCitas').textContent],
    ['Attendance Rate', document.getElementById('repAsistencia').textContent],
    ['New Patients', document.getElementById('repNuevos').textContent],
    ['Estimated Revenue', document.getElementById('repIngreso').textContent],
  ];
  doc.setFont('helvetica','normal');
  kpis.forEach(([label,val]) => { doc.text(`${label}: ${val}`, margin, y); y += 18; });
  y += 8;

  const chartSections = [
    {id:'chartMonthly', label:'New Patients'},
    {id:'chartSpecies', label:'Species Distribution'},
    {id:'chartVac', label:'Vaccination Status'},
    {id:'chartVets', label:'Patients by Veterinarian'},
    {id:'chartAfil', label:'Affiliation Codes'},
  ];
  chartSections.forEach(({id,label}) => {
    const canvas = document.getElementById(id);
    if(!canvas) return;
    const imgData = canvas.toDataURL('image/png', 1.0);
    const imgWidth = 250, imgHeight = 145;
    if(y + imgHeight + 20 > 800){ doc.addPage(); y = margin; }
    doc.setFont('helvetica','bold'); doc.setFontSize(11);
    doc.text(label, margin, y); y += 10;
    doc.addImage(imgData, 'PNG', margin, y, imgWidth, imgHeight);
    y += imgHeight + 22;
  });

  doc.save(`doppy-report-${Date.now()}.pdf`);
  toast('📄 PDF report downloaded');
}

/* ---- Detailed report (long text, real, using jsPDF) ---- */
function generarReporteDetallado(){
  if(typeof window.jspdf === 'undefined'){ toast('Could not load the PDF generator'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const margin = 40;
  let y = margin;

  const addLine = (text, size=10.5, bold=false) => {
    doc.setFont('helvetica', bold ? 'bold':'normal'); doc.setFontSize(size);
    doc.text(text, margin, y); y += size + 5;
    if(y > 790){ doc.addPage(); y = margin; }
  };

  addLine('Detailed Report — Happy Paws Veterinary Clinic', 18, true);
  addLine(`Generated: ${new Date().toLocaleString('en-US')}`, 10, false);
  y += 10;

  addLine('Veterinary Staff', 13, true);
  vets.forEach(v => addLine(`• ${v.name} — ${v.spec} — ${v.patients} patients — ${v.status}`));
  y += 8;

  addLine('Active Affiliation Codes', 13, true);
  affiliations.forEach(a => addLine(`• ${a.code} — ${a.owner} — ${a.status} — uses ${a.uses} — expires ${a.exp}`));
  y += 8;

  addLine('Expired Codes', 13, true);
  if(!expiredAffiliations.length) addLine('No expired codes recorded.');
  expiredAffiliations.forEach(a => addLine(`• ${a.code} — ${a.owner} — uses ${a.uses}`));
  y += 8;

  addLine('Pending Affiliation Requests', 13, true);
  if(!solicitudes.length) addLine('No pending requests at this time.');
  solicitudes.forEach(s => addLine(`• ${s.nombre} (${s.email}) — code ${s.code} — ${s.time}`));

  doc.save(`doppy-detailed-report-${Date.now()}.pdf`);
  toast('📄 Detailed report generated and downloaded');
}

  const species = document.getElementById('mPetSpecies').value;
  const breed = document.getElementById('mPetBreed').value.trim() || '—';
  const owner = document.getElementById('mPetOwner').value.trim() || '—';
  const vet = document.getElementById('mPetVet').value;
  const date = document.getElementById('mPetDate').value;
  pets.unshift({name, id:'PET-'+String(1000+pets.length+6), species, breed, owner, vet, vac:'Up to date',
    next: date ? new Date(date).toLocaleDateString('en-US',{day:'2-digit',month:'short',year:'numeric'}) : 'No appointment',
    emoji: species==='Cat' ? '🐈' : '🐕'});
  closeModal('petModalBg');
  ['mPetName','mPetBreed','mPetOwner','mPetDate'].forEach(id => document.getElementById(id).value = '');
  renderPets();
  toast(`✅ ${name} was registered successfully`);
}

function submitVet(){
  const name = document.getElementById('mVetName').value.trim();
  if(!name){ toast('Please enter a name for the veterinarian'); return; }
  const spec = document.getElementById('mVetSpec').value.trim() || 'General Medicine';
  const email = document.getElementById('mVetEmail').value.trim() || 'no-email@happypawsvet.com';
  const schedule = document.getElementById('mVetSchedule').value.trim() || '8:00 AM - 5:00 PM';
  vets.unshift({name, role:'Veterinarian', spec, email, schedule, patients:0, status:'Active', mv:'MV-'+Math.floor(10000+Math.random()*89999)});
  closeModal('vetModalBg');
  ['mVetName','mVetSpec','mVetEmail','mVetSchedule'].forEach(id => document.getElementById(id).value = '');
  renderVets();
  renderDashboardTables();
  toast(`✅ ${name} was added to the team`);
}

/* ============ AFFILIATION CODE GENERATION ============ */
function generarCodigo(){
  const code = randomCode();
  affiliations.unshift({code, owner:'New Owner', email:'pending@email.com', status:'Pending', exp:'—', daysLeft:30, uses:'0/10', pending:true});
  document.getElementById('statActivos').textContent = ++statCounters.activos;
  document.getElementById('statTotal').textContent = ++statCounters.total;
  afilTab = 'activos';
  switchAfilTab('activos');
  showCodeDetails(code);
  toast(`🏷️ Code ${code} generated successfully`);
}
const statCounters = {activos:24, total:320};

/* ============ CONFIG ============ */
function guardarConfig(){
  const lang = document.getElementById('cfgIdioma')?.value || 'en';
  setLanguage(lang);
  toast(getTranslation('config.toast.saveSuccess', '✅ Changes saved successfully'));
}

/* ============ TOAST ============ */
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

/* ============ INIT ============ */
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => go(btn.dataset.page));
  });
  document.getElementById('btnBell').addEventListener('click', (e) => {
    e.stopPropagation();
    document.getElementById('ddNotif').classList.toggle('open');
    document.getElementById('ddProfile').classList.remove('open');
  });
  document.getElementById('btnProfile').addEventListener('click', (e) => {
    e.stopPropagation();
    document.getElementById('ddProfile').classList.toggle('open');
    document.getElementById('ddNotif').classList.remove('open');
  });
  document.addEventListener('click', () => {
    document.getElementById('ddNotif').classList.remove('open');
    document.getElementById('ddProfile').classList.remove('open');
  });
  document.getElementById('btnLogout').addEventListener('click', () => {
    if(confirm('Log out of Doppy?')) toast('Session closed. See you soon!');
  });
  document.getElementById('ddLogout').addEventListener('click', () => {
    if(confirm('Log out of Doppy?')) toast('Session closed. See you soon!');
  });
  document.getElementById('btnExplore').addEventListener('click', () => toast('Exploring all of Doppy features…'));
  document.getElementById('cfgIdioma')?.addEventListener('change', (e) => setLanguage(e.target.value));
  document.getElementById('globalSearch').addEventListener('input', (e) => {
    const v = e.target.value.trim();
    const petSearch = document.getElementById('petSearch');
    if (petSearch && document.getElementById('page-pacientes')?.classList.contains('active')) {
      petSearch.value = v;
      renderPets();
    }
    if(v.length > 1) toast(`Searching "${v}"…`);
  });
  document.querySelectorAll('.modal-bg').forEach(bg => {
    bg.addEventListener('click', (e) => { if(e.target===bg) bg.classList.remove('open'); });
  });

  document.getElementById('btnMenu')?.addEventListener('click', (e) => {
    e.stopPropagation();
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('sidebarBackdrop').classList.add('open');
  });
  document.getElementById('sidebarBackdrop')?.addEventListener('click', () => {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarBackdrop').classList.remove('open');
  });

  renderDashboardTables();
  renderNotifications();
  renderSolicitudes();
  renderPets();
  renderAfiliaciones();
  renderVets();
  applyTranslations();
  if(affiliations.length) showCodeDetails(affiliations[0].code);
});

</script>
