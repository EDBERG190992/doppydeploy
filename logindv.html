<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doppy</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="logindv.css" />
</head>
<body>

<div class="toast" id="toast"></div>

<div class="card">

  <!-- ═══ LEFT ═══ -->
  <div class="left">

    <div class="top-nav">
      <a class="nav-btn" href="typeofuser.html" aria-label="Atrás" style="text-decoration:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <button class="nav-btn" aria-label="Ayuda">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><circle cx="12" cy="17" r=".5" fill="currentColor"/></svg>
      </button>
    </div>

    <div class="logo">
      <div class="logo-frame">
        <img class="logo-img" src="assets/Type 2.png" alt="Doppy Logo" />
      </div>
    </div>

    <h2>¡Bienvenido de nuevo!</h2>
    <p class="sub">Inicia sesión para seguir cuidando a tus mascotas.</p>

    <form id="loginForm" onsubmit="event.preventDefault(); login();">
      <div class="input-group">
        <!-- Name -->
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4z"/>
              <path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
            </svg>
          </span>
          <input type="text" id="name" placeholder="Ingresa tu nombre" autocomplete="name" />
        </div>

        <!-- Email -->
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <path d="M22 7l-10 7L2 7"/>
            </svg>
          </span>
          <input type="email" id="email" placeholder="Ingresa tu correo" autocomplete="email" />
        </div>

        <!-- Password -->
        <div class="pass-row" style="position:relative;">
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0110 0v4"/>
              </svg>
            </span>
            <input type="password" id="pass" placeholder="Ingresa tu contraseña" autocomplete="current-password" />
            <button class="toggle-btn" onclick="togglePass()" type="button" aria-label="Mostrar/ocultar contraseña">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-cta">Entrar</button>
    </form>
    <a class="forgot" href="#">¿Olvidaste tu contraseña?</a>

  </div>

  <!-- ═══ RIGHT ═══ -->
  <div class="right">
    <div class="right-heart">
      <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M28 46 C28 46 8 34 8 20 C8 13 13 8 20 8 C24 8 28 11 28 11 C28 11 32 8 36 8 C43 8 48 13 48 20 C48 34 28 46 28 46Z"
          stroke="#3B6FD4" stroke-width="2.5" fill="none"/>
      </svg>
    </div>
    <div class="right-dot-1"></div>
    <div class="right-dot-2"></div>
    <div class="right-circle-lg"></div>
    <div class="right-wave"></div>
  </div>

</div>

<script src="logindv.js"></script>
</body>
</html>
